<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>רשימת פרויקטים - TodoPro</title>
  <link rel="stylesheet" href="./projects.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
  <!-- רקע חלקיקים -->
  <div id="particle-background"></div>

  <!-- כותרת עליונה -->
  <header class="page-header">
    <!-- צד שמאל - אייקון חזרה לדף הבית -->
    <a href="../pages/manager.html" class="back-home" title="חזור לדף הבית">
      <i class="fa-solid fa-house"></i>
    </a>

    <!-- צד ימין - פרטי המשתמש -->
    <div class="user-info">
      <span id="user-name" class="user-name">שלום, משתמש</span>
      <img id="profile-img" src="default-avatar.png" alt="תמונת פרופיל" class="profile-img">
    </div>
  </header>

  <!-- תוכן מרכזי -->
  <main class="projects-container">
    <h1>רשימת פרויקטים</h1>
    <div id="projects" class="projects-grid">
      <!-- פרויקטים ייטענו כאן דינמית -->
    </div>
  </main>

  <!-- מודל עריכת פרויקט -->
  <div id="edit-modal" class="hidden">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>עריכת פרויקט</h2>

      <div class="form-group">
        <label for="modal-teamLead">ראש צוות:</label>
        <input type="text" id="modal-teamLead" placeholder="שם ראש הצוות">
      </div>

      <div class="form-group">
        <label for="modal-teamCode">קוד צוות:</label>
        <input type="text" id="modal-teamCode" placeholder="קוד צוות">
      </div>

      <button id="modal-save-btn" class="btn-primary">שמור</button>
    </div>
  </div>

  <!-- ספריות JS -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script type="module" src="./projects.js" defer></script>

  <!-- רקע חלקיקים -->
  <script>
    particlesJS('particle-background', {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: ['#3b82f6','#10b981','#ffffff'] },
        shape: { type: 'circle' },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: '#ffffff', opacity: 0.4, width: 1 },
        move: { enable: true, speed: 2 }
      },
      interactivity: {
        events: { onhover: { enable: true, mode: 'grab' }, onclick: { enable: true, mode: 'push' } },
        modes: { grab: { distance: 200, line_linked: { opacity: 0.7 } }, push: { particles_nb: 4 } }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
