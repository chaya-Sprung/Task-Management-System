<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הוספת פרויקט - TodoPro</title>
  <link rel="stylesheet" href="addProject.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <!-- כותרת עליונה -->
  <header class="page-header">
    <!-- צד שמאל - אייקון חזרה לדף הבית -->
    <a href="../pages/manager.html" class="back-home" title="חזור לדף הבית">
      <i class="fa-solid fa-house"></i>
    </a>

    <!-- צד ימין - פרטי המשתמש -->
    <div class="user-info">
      <span id="user-name" class="user-name">שלום, משתמש</span>
      <img id="profile-img" src="default-avatar.png" alt="תמונת פרופיל" class="profile-img">
    </div>
  </header>

  <div id="particle-background"></div>
  <div class="form-container">
    <h2>טופס להוספת פרויקט</h2>

    <form id="addProjectForm">
      <label for="projectCode">קוד פרויקט *</label>
      <input type="text" id="projectCode" placeholder="הכנס קוד פרויקט" required>

      <label for="projectName">שם פרויקט *</label>
      <input type="text" id="projectName" placeholder="שם הפרויקט" required>

      <label for="groupCode">קוד קבוצה</label>
      <input type="text" id="groupCode" placeholder="קוד קבוצה (אופציונלי)">

      <label for="teamLeadName">שם ראש הצוות</label>
      <input type="text" id="teamLeadName" placeholder="שם ראש הצוות (אופציונלי)">

      <button type="submit"><i class="fas fa-plus"></i> הוסף פרויקט</button>
    </form>

    <div id="result"></div>
  </div>

  <!-- Particle.js for background -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particle-background', {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: ['#3b82f6', '#10b981', '#ffffff'] },
        shape: { type: 'circle' },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: '#ffffff', opacity: 0.4, width: 1 },
        move: { enable: true, speed: 2, direction: 'none', random: true }
      },
      interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'grab' }, onclick: { enable: true, mode: 'push' } },
        modes: { grab: { distance: 200, line_linked: { opacity: 0.7 } }, push: { particles_nb: 4 } }
      },
      retina_detect: true
    });
  </script>
  <script type="module" src="addProject.js"></script>
</body>
</html>
