<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דף עובד - TodoPro</title>
  <link rel="stylesheet" href="employee.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
  <div id="particle-background"></div>

  <div id="employee-container">
    <!-- כרטיס המשתמש -->
    <div id="user-card">
      <div class="info">
        <h3 id="greeting">שלום!</h3>
        <p id="role">תפקיד:</p>
      </div>
      <img id="avatar" src="default-avatar.png" alt="Avatar" />
    </div>

    <!-- הודעת ברכה -->
    <h1 id="welcome-message"></h1>
    <p class="subtitle">נהל את המשימות והצוותים שלך בסטייל עתידני</p>

    <!-- כפתורים -->
    <div class="buttons">
      <button id="show-tasks" class="btn-primary"><i class="fas fa-list"></i> הצגת משימות</button>
    </div>
  </div>

  <!-- Particle.js for background -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    particlesJS('particle-background', {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: ['#3b82f6', '#10b981', '#ffffff'] },
        shape: { type: 'circle' },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: '#ffffff', opacity: 0.4, width: 1 },
        move: { enable: true, speed: 2, direction: 'none', random: true }
      },
      interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'grab' }, onclick: { enable: true, mode: 'push' } },
        modes: { grab: { distance: 200, line_linked: { opacity: 0.7 } }, push: { particles_nb: 4 } }
      },
      retina_detect: true
    });
  </script>
  <script type="module" src="./employee.js"></script>
</body>
</html>
