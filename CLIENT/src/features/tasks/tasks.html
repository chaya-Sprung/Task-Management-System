<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משימות פרויקט - TodoPro</title>
  <link rel="stylesheet" href="./tasks.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <!-- כותרת עליונה -->
  <header class="page-header">
    <!-- צד שמאל - אייקון חזרה לדף הבית -->
    <a href="../pages/.html" class="back-home" title="חזור לדף הבית">
      <i class="fa-solid fa-house"></i>
    </a>

    <!-- צד ימין - פרטי המשתמש -->
    <div class="user-info">
      <span id="user-name" class="user-name">שלום, משתמש</span>
      <img id="profile-img" src="default-avatar.png" alt="תמונת פרופיל" class="profile-img">
    </div>
  </header>

  <div id="particle-background"></div>

  <div class="tasks-container">
    <h1>משימות הפרויקט</h1>
    <div id="tasksContainer"></div>
  </div>

  <!-- Modal לעדכון סטטוס -->
  <div id="statusModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>עדכון סטטוס</h3>
      <select id="statusSelect">
        <option value="open">Open</option>
        <option value="in-progress">In Progress</option>
        <option value="done">Done</option>
      </select>
      <button id="saveStatus">שמור</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script type="module" src="./tasks.js" defer></script>

  <script>
    particlesJS('particle-background', {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: ['#3b82f6', '#10b981', '#ffffff'] },
        shape: { type: 'circle' },
        opacity: { value: 0.5, random: true },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: '#ffffff', opacity: 0.4, width: 1 },
        move: { enable: true, speed: 2, direction: 'none', random: true }
      },
      interactivity: {
        detect_on: 'canvas',
        events: { onhover: { enable: true, mode: 'grab' }, onclick: { enable: true, mode: 'push' } },
        modes: { grab: { distance: 200, line_linked: { opacity: 0.7 } }, push: { particles_nb: 4 } }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
